[project]
name = "pln-pf"
version = "0.1.0"
description = "Clasificación de textos y Agentes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "clasificador",
    "agente"
]

[tool.uv.workspace]
members = [
    "clasificador",
    "agente",
]

[tool.uv.sources]
clasificador = { workspace = true }
agente = {workspace = true }
